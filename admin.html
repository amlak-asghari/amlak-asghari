<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پنل مدیریت | املاک اصغری</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header class="top"><div class="wrap nav"><a href="index.html" class="brand"><img src="assets/logo.jpg"><span>پنل مدیریت</span></a><nav><a href="index.html">نمایش سایت</a><button class="linkbtn" id="logout">خروج</button></nav></div></header><main class="wrap admin"><section id="loginBox" class="panel"><h1>ورود مدیر</h1><input id="email" type="email" placeholder="ایمیل مدیر"><input id="password" type="password" placeholder="رمز عبور"><button id="login">ورود</button><div id="loginStatus"></div></section><section id="dashboard" class="hidden"><div class="stats"><div><b id="visitCount">0</b><span>بازدید</span></div><div><b id="propertyCount">0</b><span>ملک</span></div><div><b id="messageCount">0</b><span>پیام جدید</span></div></div><div class="panel"><h2>افزودن ملک</h2><form id="propertyForm"><div class="grid"><input name="title" placeholder="عنوان ملک" required><select name="type"><option>زمین</option><option>خانه</option><option>آپارتمان</option><option>مغازه</option><option>ویلا</option><option>دفتر</option></select><select name="deal"><option>خرید</option><option>فروش</option><option>رهن</option><option>اجاره</option></select><input name="area" type="number" placeholder="متراژ"><input name="price" type="number" placeholder="قیمت کل تومان"><input name="location" placeholder="موقعیت"><input name="rooms" type="number" placeholder="تعداد اتاق"><input name="owner_name" placeholder="نام مالک - خصوصی"><input name="owner_phone" placeholder="تلفن مالک - خصوصی"></div><textarea name="description" placeholder="توضیحات"></textarea><label class="check"><input name="urgent" type="checkbox"> فوری</label><label class="check"><input name="special" type="checkbox"> ویژه</label><label class="check"><input name="ladder" type="checkbox"> نردبان</label><label>عکس/فیلم <input name="media" type="file" accept="image/*,video/*" multiple></label><button>ثبت ملک</button><div id="propertyStatus"></div></form></div><div class="panel"><h2>املاک ثبت‌شده</h2><div id="adminListings"></div></div><div class="panel"><h2>پیام‌های مشتریان</h2><div id="messages"></div></div><div class="panel"><h2>امنیت و ۲ مرحله‌ای</h2><p id="mfaState">در حال بررسی...</p><button id="setupMfa">راه‌اندازی ۲ مرحله‌ای</button><div id="mfaBox"></div><hr><h3>تغییر رمز</h3><input id="newPass" type="password" placeholder="رمز جدید"><button id="changePass">تغییر رمز</button><div id="securityStatus"></div></div></section></main><script src="config.js"></script><script src="admin.js"></script></body></html>
